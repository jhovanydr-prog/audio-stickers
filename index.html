<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creador de Stickers MP4</title>
    
    <!-- Diseño visual libre de bloqueos -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- NUEVO MOTOR: FFmpeg v12 (No requiere configuraciones de servidor) -->
    <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script>
    <script src="https://unpkg.com/@ffmpeg/util@0.12.1/dist/umd/index.js"></script>
    
    <style>
        .timeline-container { position: relative; height: 40px; background: #374151; border-radius: 8px; margin-top: 10px; overflow: hidden; }
        .timeline-track { position: absolute; top: 0; bottom: 0; background: #ec4899; opacity: 0.3; }
        .timeline-handle { position: absolute; top: 0; bottom: 0; width: 10px; background: #ec4899; cursor: ew-resize; z-index: 10; display: flex; align-items: center; justify-content: center; }
        .timeline-handle::after { content: ''; width: 2px; height: 15px; background: white; }
        
        .video-wrapper { position: relative; width: 100%; max-width: 320px; height: 568px; background: #000; margin: 0 auto; border-radius: 12px; overflow: hidden; display: none; }
        .video-placeholder { width: 100%; height: 100%; object-fit: fill; } 
        
        .crop-box { position: absolute; top: 20%; left: 20%; width: 200px; height: 200px; border: 2px solid #ec4899; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.6); cursor: move; touch-action: none; z-index: 5; }
        .crop-resizer { position: absolute; right: -6px; bottom: -6px; width: 16px; height: 16px; background: #ec4899; border: 2px solid white; border-radius: 50%; cursor: nwse-resize; z-index: 20; }
        
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50; justify-content: center; align-items: center; }
        .toggle-checkbox:checked { right: 0; border-color: #ec4899; }
        .toggle-checkbox:checked + .toggle-label { background-color: #ec4899; }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans antialiased min-h-screen flex flex-col items-center py-10 px-4">

    <div class="w-full max-w-md bg-gray-800 rounded-2xl shadow-2xl p-6">
        <h1 class="text-2xl font-bold text-center mb-6 text-pink-500">Sticker MP4 Editor</h1>
        
        <div id="step-url" class="space-y-4">
            <p class="text-sm text-gray-400 text-center">Pega el enlace de TikTok</p>
            <input type="text" id="tiktokUrl" placeholder="https://vm.tiktok.com/..." class="w-full bg-gray-700 text-white px-4 py-3 rounded-lg focus:outline-none focus:ring-2 focus:ring-pink-500 border border-gray-600">
            <button onclick="fetchVideo()" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-lg transition-colors flex justify-center items-center">
                <span id="btnText">Cargar Video</span>
                <svg id="btnSpinner" class="animate-spin ml-2 h-5 w-5 text-white hidden" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            </button>
        </div>

        <div id="step-edit" class="hidden mt-6 space-y-6">
            <div class="text-center text-xs text-gray-400 mb-2">Arrastra para encuadrar y recorta el tiempo.</div>
            
            <div class="video-wrapper" id="videoWrapper"></div>

            <div>
                <div class="flex justify-between text-xs text-gray-400 font-mono">
                    <span id="timeStartLabel">00:00</span>
                    <span id="timeEndLabel">Calculando...</span>
                </div>
                <div class="timeline-container" id="timeline">
                    <div class="timeline-track" id="track" style="left: 0%; right: 0%;"></div>
                    <div class="timeline-handle" id="handleStart" style="left: 0%;"></div>
                    <div class="timeline-handle" id="handleEnd" style="right: 0%;"></div>
                </div>
                <div class="text-center text-xs text-pink
